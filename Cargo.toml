[package]
name = "webdesserts-mesh"
version = "0.1.0"
edition = "2024"

[dependencies]
p2p-core = { git = "https://github.com/webdesserts/p2p-core.git", tag = "v0.1.2" }
anyhow = "1.0"
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "default", "platform-verifier"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
p2p-core = { git = "https://github.com/webdesserts/p2p-core.git", tag = "v0.1.2", features = ["test-util"] }
