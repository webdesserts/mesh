[package]
name = "mesh-desktop"
version = "0.3.1"
edition = "2024"
description = "Mesh.app — macOS menu-bar tray app hosting the webdesserts-mesh daemon"

[[bin]]
name = "Mesh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
webdesserts-mesh = { path = "../.." }
p2p-core = { git = "https://github.com/webdesserts/p2p-core.git", tag = "v0.1.6" }
app-config = { git = "https://github.com/webdesserts/app-config.git", tag = "v0.1.0" }
tauri = { version = "2", features = ["tray-icon", "image-png", "wry"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
