<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pair Device</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="bar">
  <span class="mark" aria-hidden="true"></span>
  <h1>Pair Device</h1>
</header>

<nav class="tabs" role="tablist">
  <button id="tab-show" class="tab active" role="tab" aria-selected="true">Show Pairing Code</button>
  <button id="tab-connect" class="tab" role="tab" aria-selected="false">Connect to Peer</button>
</nav>

<section id="panel-show" class="panel">
  <p class="hint">Share your Node ID with the other device, then generate a code they can enter.</p>
  <dl class="facts">
    <dt>Device</dt><dd id="show-device">—</dd>
    <dt>Node ID</dt><dd id="show-node" class="mono">—</dd>
  </dl>
  <div class="row">
    <button id="copy-node" class="ghost">Copy Node ID</button>
    <button id="gen-code" class="primary">Generate 6-Digit Code</button>
  </div>
  <div id="code-box" class="code-box hidden">
    <div id="code-digits" class="digits">000 000</div>
    <div id="code-countdown" class="countdown">300s</div>
  </div>
  <p id="show-status" class="status" role="status"></p>
</section>

<section id="panel-connect" class="panel hidden">
  <p class="hint">Enter the other device's Node ID and the 6-digit code it generated.</p>
  <label>Peer Node ID
    <input id="peer-id" class="mono" type="text" placeholder="0123456789abcdef…" autocomplete="off" />
  </label>
  <label>6-Digit Pairing Code
    <input id="peer-code" class="mono" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" />
  </label>
  <label>Relay URL <span class="optional">(optional)</span>
    <input id="relay-url" class="mono" type="text" placeholder="http://umbra.local:3340" autocomplete="off" />
  </label>
  <label>Relationship
    <select id="relationship">
      <option value="self" selected>Own Device (self)</option>
      <option value="friend">Friend Device (friend)</option>
    </select>
  </label>
  <button id="pair-btn" class="primary">Pair Device</button>
  <p id="connect-status" class="status" role="status"></p>
</section>

<section class="members">
  <h2>Active Members</h2>
  <ul id="member-list" class="member-list"></ul>
</section>

<script src="pair.js"></script>
</body>
</html>
